<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSA 포인트 대출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1e1b4b;
  --primary-hover: #312e81;
  --primary-soft: rgba(30,27,75,.08);
  --bg: #f9fafb;
  --card: #ffffff;
  --fg: #111827;
  --fg2: #374151;
  --muted: #6b7280;
  --border: #e5e7eb;
  --surface: #f3f4f6;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --danger-b: #fecaca;
  --success: #16a34a;
  --success-bg: #f0fdf4;
  --success-b: #bbf7d0;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --warn-b: #fde68a;
  --primary-border-soft: rgba(30,27,75,.12);
  --r: 12px; --r-s: 8px; --r-xs: 6px;
  --sh: 0 1px 3px rgba(0,0,0,.08);
  --sh-md: 0 4px 16px rgba(0,0,0,.07);
  --font: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #818cf8;
    --primary-hover: #a5b4fc;
    --bg: #0d0c1a; --card: #16152b; --fg: #f3f4f6; --fg2: #d1d5db;
    --muted: #9ca3af; --border: #2a2847; --surface: #1e1c35;
    --primary-soft: rgba(129,140,248,.14);
    --primary-border-soft: rgba(129,140,248,.25);
    --danger-bg: #2d1515; --danger-b: #7f1d1d;
    --success-bg: #0f2a0f; --success-b: #14532d;
    --warn-bg: #2a1a08; --warn-b: #78350f;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 20px;
}
.logo{
  width:36px;height:36px;background:var(--primary);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
}
.app-name{font-size:15px;font-weight:600;color:var(--primary);flex:1}
.admin-pill{
  display:inline-flex;align-items:center;padding:2px 8px;background:var(--primary);
  color:#fff;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.05em;
}
.user-chip{
  display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;
  background:var(--surface);border-radius:20px;font-size:13px;color:var(--muted);
}
.avi{
  width:24px;height:24px;background:var(--primary);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;
}
.logout-btn{
  background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;
  padding:4px 8px;border-radius:4px;font-family:var(--font);
}
.logout-btn:hover{background:var(--surface)}

/* PAGE */
.pg{max-width:680px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:16px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.balance-card{
  background:var(--primary);
  background-image:radial-gradient(circle at 90% 20%,rgba(99,102,241,.3),transparent 55%),
                   radial-gradient(circle at 10% 85%,rgba(167,139,250,.18),transparent 50%);
  border-radius:var(--r);padding:24px;color:#fff;position:relative;overflow:hidden;
}
.bal-label{font-size:12px;opacity:.7;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.bal-num{font-size:36px;font-weight:700;letter-spacing:-1px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.bal-unit{font-size:20px;font-weight:500;opacity:.8;margin-left:2px}
.bal-icon{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:64px;opacity:.12}

/* SECTION HEADING */
.sh{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.cnt{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:10px}

/* TABS */
.tabs{display:flex;background:var(--surface);border-radius:var(--r-s);padding:4px;gap:2px}
.tab{flex:1;padding:8px;background:none;border:none;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.tab.on{background:var(--card);color:var(--primary);box-shadow:var(--sh)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border:none;border-radius:var(--r-s);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:var(--r-xs)}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:var(--r-xs)}
.btn-out{background:none;border:1px solid var(--border);color:var(--fg)}
.btn-out:hover:not(:disabled){background:var(--surface)}
.btn-danger{background:var(--danger-bg);border:1px solid var(--danger-b);color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-ok{background:var(--success-bg);border:1px solid var(--success-b);color:var(--success)}
.btn-ok:hover:not(:disabled){background:var(--success);color:#fff}
.btn-warn{background:var(--warn-bg);border:1px solid var(--warn-b);color:var(--warn)}
.btn-warn:hover:not(:disabled){background:var(--warn);color:#fff}

/* FORM */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg:last-child{margin-bottom:0}
label{font-size:13px;font-weight:500;color:var(--fg2)}
.iw{position:relative;display:flex;align-items:center}
.iunit{position:absolute;right:12px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=password]{
  width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-s);
  font-family:var(--font);font-size:14px;color:var(--fg);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s;
}
.iw input{padding-right:36px}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input::-webkit-inner-spin-button{-webkit-appearance:none}
.hint{font-size:12px;color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* LOAN ITEM */
.li{border:1px solid var(--border);border-radius:var(--r-s);overflow:hidden;background:var(--card);margin-bottom:8px}
.li:last-child{margin-bottom:0}
.li-hd{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:background .1s}
.li-hd:hover{background:var(--surface)}
.li-name{font-size:14px;font-weight:600;color:var(--fg)}
.li-sid{font-size:11px;color:var(--muted);margin-top:1px}
.li-amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);text-align:right}
.li-int{font-size:11px;color:var(--warn);text-align:right;margin-top:1px}
.li-bd{padding:14px 16px;background:var(--surface);border-top:1px solid var(--border);display:none}
.li-bd.open{display:block}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ml{font-size:11px;color:var(--muted)}
.mv{font-size:13px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:7px;flex-wrap:wrap}

/* BADGE */
.bdg{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-pend{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-b)}
.b-act{background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-border-soft, rgba(30,27,75,.12))}
.b-rep{background:var(--success-bg);color:var(--success);border:1px solid var(--success-b)}
.b-ov{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-b)}
.b-def{background:var(--surface);color:var(--muted);border:1px solid var(--border)}

/* ALERTS */
.al{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-radius:var(--r-s);font-size:13px;line-height:1.5}
.al-w{background:var(--warn-bg);border:1px solid var(--warn-b);color:var(--warn)}
.al-d{background:var(--danger-bg);border:1px solid var(--danger-b);color:var(--danger)}
.al-s{background:var(--success-bg);border:1px solid var(--success-b);color:var(--success)}
.al-icon{flex-shrink:0;font-size:15px;line-height:1.5}

/* PROGRESS */
.prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.prog-fill.w{background:var(--warn)}
.prog-fill.d{background:var(--danger)}

/* PREVIEW BOX */
.preview-box{background:var(--primary-soft);border:1px solid var(--primary-border-soft, rgba(30,27,75,.12));border-radius:var(--r-s);padding:14px 16px;margin-top:14px}
.preview-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
.preview-row .pv{font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary)}
.preview-total{font-size:15px;font-weight:700;padding-top:8px;margin-top:4px;border-top:1px solid var(--primary-border-soft, rgba(30,27,75,.12))}
.preview-total .pv{font-size:16px}

/* SIGN-IN */
.signin-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg)}
.signin-card{width:100%;max-width:400px;background:var(--card);border-radius:var(--r);padding:40px 32px;box-shadow:var(--sh-md);border:1px solid var(--border)}
.signin-logo{width:52px;height:52px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin:0 auto 20px}
.signin-h{text-align:center;font-size:22px;font-weight:700;margin:0 0 4px}
.signin-sub{text-align:center;font-size:13px;color:var(--muted);margin:0 0 24px;line-height:1.5}
.type-tabs{display:flex;background:var(--surface);border-radius:var(--r-s);padding:4px;gap:2px;margin-bottom:20px}
.type-tab{flex:1;padding:8px;background:none;border:none;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.type-tab.on{background:var(--card);color:var(--primary);box-shadow:var(--sh)}

/* STAT ROW */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-s);padding:14px 10px;text-align:center;box-shadow:var(--sh)}
.stat-n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary)}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:var(--r);padding:26px 24px;max-width:420px;width:100%;box-shadow:var(--sh-md)}
.modal-title{font-size:16px;font-weight:700;margin:0 0 12px}
.modal-body{font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* TOAST */
#tc{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:11px 20px;background:var(--fg);color:var(--card);border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--sh-md);animation:tin .2s ease;max-width:340px;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* UTILS */
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lc{display:flex;align-items:center;justify-content:center;gap:14px;padding:60px 20px;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:28px 20px;color:var(--muted);font-size:14px}
.empty-ic{font-size:30px;margin-bottom:8px}
.text-d{color:var(--danger)}.text-s{color:var(--success)}.text-w{color:var(--warn)}
[hidden]{display:none!important}

@media(max-width:480px){
  .form-row{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .signin-card{padding:28px 18px}
}
</style>
</head>
<body>

<div id="tc"></div>
<div id="mc"></div>
<div id="app"></div>

<script>
const RATE = 0.05;
const PERIOD = 24 * 3600 * 1000;
let _user = null;
let _loans = [];
let _tab = 'pending';
let _ticker = null;
let _loginType = 'student';

const fmt = n => Math.ceil(n).toLocaleString('ko-KR');
const fmtDate = ts => new Date(ts).toLocaleDateString('ko-KR', {year:'numeric',month:'short',day:'numeric'});
function calcLocal(loan) {
  if (loan.status !== 'active') return loan.amount;
  const start = loan.activatedAt || loan.requestedAt;
  const periods = Math.floor((Date.now() - start) / PERIOD);
  return Math.ceil(loan.amount * Math.pow(1 + RATE, periods));
}
function calcAtDate(amount, days) { return Math.ceil(amount * Math.pow(1+RATE, Math.max(0, days))); }
function getDaysLeft(loan) {
  if (loan.status !== 'active') return '';
  const d = Math.ceil((loan.dueDate - Date.now()) / 86400000);
  if (d < 0) return Math.abs(d) + '일 연체';
  if (d === 0) return '오늘 만료';
  return d + '일 남음';
}
function statusText(s, dueDate) {
  if (s === 'pending') return '대기 중';
  if (s === 'repaid') return '상환 완료';
  if (s === 'defaulted') return '전액 몰수';
  if (s === 'rejected') return '거절됨';
  if (s === 'active') return Date.now() > dueDate ? '연체' : '대출 중';
  return s;
}
function statusBadge(s, dueDate) {
  if (s === 'pending') return 'b-pend';
  if (s === 'repaid') return 'b-rep';
  if (s === 'defaulted' || s === 'rejected') return 'b-def';
  if (s === 'active') return Date.now() > dueDate ? 'b-ov' : 'b-act';
  return 'b-def';
}

/* TOAST */
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast';
  if (type==='err') el.style.background='#ef4444';
  if (type==='ok') el.style.background='#16a34a';
  el.textContent = msg;
  document.getElementById('tc').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* MODAL */
function modal(title, body, actions) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal-box">
      <div class="modal-title">${title}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-actions" id="_ma"></div>
    </div>`;
    actions.forEach(a => {
      if (a.href) {
        const link = document.createElement('a');
        link.href = a.href; link.target = '_blank';
        link.className = 'btn btn-sm ' + (a.cls||'btn-out');
        link.textContent = a.label;
        link.style.textDecoration = 'none';
        bg.querySelector('#_ma').appendChild(link);
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (a.cls||'btn-out');
      btn.textContent = a.label;
      btn.onclick = () => { bg.remove(); resolve(a.value); };
      bg.querySelector('#_ma').appendChild(btn);
    });
    bg.onclick = e => { if(e.target===bg){bg.remove();resolve(null);} };
    document.getElementById('mc').appendChild(bg);
  });
}

/* API HELPERS */
async function api(method, url, body) {
  const opts = { method, headers: {'Content-Type':'application/json'}, credentials:'include' };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '오류가 발생했습니다.');
  return data;
}

/* RENDER APP */
function render() {
  document.getElementById('app').innerHTML = _user ? renderApp() : renderSignIn();
  if (_user) bindAppEvents();
}

/* SIGN IN PAGE */
function renderSignIn() {
  return `<div class="signin-wrap">
    <div class="signin-card">
      <div class="signin-logo">대출</div>
      <h1 class="signin-h">KSA 포인트 대출</h1>
      <p class="signin-sub">ksain.kr 계정으로 로그인하세요</p>
      <div class="type-tabs">
        <button class="type-tab ${_loginType==='student'?'on':''}" onclick="setLoginType('student')">학생 로그인</button>
        <button class="type-tab ${_loginType==='general'?'on':''}" onclick="setLoginType('general')">일반 로그인</button>
      </div>
      <form id="lf" onsubmit="doLogin(event)">
        <div class="fg">
          <label>${_loginType==='student'?'학번 (positionID)':'아이디'}</label>
          <input type="text" id="f-uid" placeholder="${_loginType==='student'?'26-000':'아이디 입력'}" required>
        </div>
        <div class="fg" style="margin-bottom:20px">
          <label>비밀번호</label>
          <input type="password" id="f-pw" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">로그인</button>
      </form>
      <div id="login-err" style="color:var(--danger);font-size:12px;margin-top:12px;text-align:center"></div>
    </div>
  </div>`;
}
function setLoginType(t) { _loginType = t; render(); }

async function doLogin(e) {
  e.preventDefault();
  const uid = document.getElementById('f-uid').value.trim();
  const password = document.getElementById('f-pw').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-err');
  btn.disabled = true; btn.textContent = '로그인 중...'; errEl.textContent = '';
  try {
    const data = await api('POST', '/api/login', { uid, password, type: _loginType });
    _user = data.user;
    await loadLoans();
    render();
  } catch(err) {
    errEl.textContent = err.message;
    btn.disabled = false; btn.textContent = '로그인';
  }
}

async function doLogout() {
  await api('POST', '/api/logout');
  _user = null; _loans = [];
  render();
}

/* MAIN APP */
function renderApp() {
  const isAdmin = _user.isAdmin;
  const hdr = `<header class="hdr">
    <div class="logo">대출</div>
    <span class="app-name">포인트 대출</span>
    ${isAdmin ? '<span class="admin-pill">관리자</span>' : ''}
    <div class="user-chip">
      <div class="avi">${_user.name.charAt(0)}</div>
      <span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_user.name}</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </header>`;
  const main = `<div class="pg" id="main"></div>`;
  return hdr + `<div>${main}</div>`;
}

function bindAppEvents() {
  if (_ticker) clearInterval(_ticker);
  renderMain();
  _ticker = setInterval(tickerUpdate, 15000);
}

function renderMain() {
  const el = document.getElementById('main');
  if (!el) return;
  el.innerHTML = _user.isAdmin ? renderAdmin() : renderUser();
}

function tickerUpdate() {
  _loans.filter(l => l.status === 'active').forEach(l => {
    const total = calcLocal(l);
    const int = total - l.amount;
    const hEl = document.getElementById('ha-'+l.id);
    const iEl = document.getElementById('int-'+l.id);
    const tEl = document.getElementById('tot-'+l.id);
    if (hEl) hEl.textContent = fmt(total) + 'P';
    if (iEl) iEl.textContent = fmt(int) + 'P';
    if (tEl) tEl.textContent = fmt(total) + 'P';
  });
  const active = _loans.filter(l => l.status === 'active');
  const totalDebt = active.reduce((s, l) => s + calcLocal(l), 0);
  const dEl = document.getElementById('debt-num');
  if (dEl) dEl.innerHTML = fmt(totalDebt) + '<span class="bal-unit">P</span>';
}

/* USER VIEW */
function renderUser() {
  const my = _loans.filter(l => l.borrowerUid === _user.uid && l.status !== 'rejected');
  const active = my.filter(l => l.status === 'active');
  const totalDebt = active.reduce((s, l) => s + calcLocal(l), 0);
  const overdue = active.filter(l => Date.now() > l.dueDate);
  const canReq = !my.some(l => l.status === 'active' || l.status === 'pending');
  const minDate = new Date(Date.now() + 86400000).toISOString().split('T')[0];

  return `
    ${overdue.length ? `<div class="al al-d"><span class="al-icon">🚨</span><div>연체 대출 ${overdue.length}건이 있습니다! 즉시 상환해 주세요.</div></div>` : ''}
    ${active.length ? `<div class="balance-card">
      <div class="bal-label">총 상환 예정 금액</div>
      <div class="bal-num" id="debt-num">${fmt(totalDebt)}<span class="bal-unit">P</span></div>
      <div class="bal-icon">₩</div>
    </div>` : ''}
    <div class="card">
      <div class="sh" style="margin-bottom:16px">새 대출 신청</div>
      ${!canReq ? `<div class="al al-w"><span class="al-icon">ℹ️</span><span>진행 중인 대출이 있습니다. 상환 완료 후 다시 신청하세요.</span></div>` : `
      <form id="lf" onsubmit="submitLoan(event)">
        <div class="form-row">
          <div class="fg"><label>빌릴 포인트</label>
            <div class="iw"><input id="f-amt" type="number" placeholder="0" min="1" required oninput="updatePreview()">
            <span class="iunit">P</span></div>
            <span class="hint">24시간마다 5% 복리 이자</span>
          </div>
          <div class="fg"><label>갚을 날짜</label>
            <input id="f-due" type="date" min="${minDate}" required onchange="updatePreview()">
          </div>
        </div>
        <div id="preview" hidden class="preview-box">
          <div style="font-size:11px;font-weight:600;color:var(--primary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em">이자 계산 미리보기</div>
          <div class="preview-row"><span>대출 기간</span><span class="pv" id="pv-days">-</span></div>
          <div class="preview-row"><span>예상 이자</span><span class="pv text-w" id="pv-int">-</span></div>
          <div class="preview-row preview-total"><span>만기 시 총 상환액</span><span class="pv" id="pv-tot">-</span></div>
        </div>
        <div class="al al-w" style="margin-top:14px;margin-bottom:16px">
          <span class="al-icon">⚠️</span>
          <div style="font-size:12px">이자는 24시간마다 5%씩 복리로 증가합니다.</div>
        </div>
        <button type="submit" class="btn btn-primary" id="req-btn">대출 신청</button>
      </form>`}
    </div>
    ${my.length ? `<div>
      <div class="sh">내 대출 현황 <span class="cnt">${my.length}건</span></div>
      ${my.map(l => loanItem(l, false)).join('')}
    </div>` : ''}`;
}

function updatePreview() {
  const a = parseInt(document.getElementById('f-amt')?.value)||0;
  const dv = document.getElementById('f-due')?.value;
  const box = document.getElementById('preview');
  if (!box) return;
  if (!a || !dv) { box.hidden = true; return; }
  const days = Math.max(0, Math.ceil((new Date(dv).getTime() - Date.now()) / 86400000));
  const total = calcAtDate(a, days);
  document.getElementById('pv-days').textContent = days + '일';
  document.getElementById('pv-int').textContent = fmt(total - a) + 'P';
  document.getElementById('pv-tot').textContent = fmt(total) + 'P';
  box.hidden = false;
}

async function submitLoan(e) {
  e.preventDefault();
  const btn = document.getElementById('req-btn');
  const amount = parseInt(document.getElementById('f-amt').value);
  const dueDate = document.getElementById('f-due').value;
  btn.disabled = true; btn.textContent = '신청 중...';
  try {
    await api('POST', '/api/loans', { amount, dueDate });
    toast('대출 신청 완료! 관리자 승인을 기다려주세요.', 'ok');
    await loadLoans(); renderMain();
  } catch(err) { toast(err.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '대출 신청'; }
}

/* ADMIN VIEW */
function renderAdmin() {
  const pending = _loans.filter(l => l.status === 'pending');
  const active = _loans.filter(l => l.status === 'active');
  const overdue = active.filter(l => Date.now() > l.dueDate);
  const totalDebt = active.reduce((s, l) => s + calcLocal(l), 0);
  const tabLoans = _tab === 'pending' ? pending : _tab === 'active' ? active : _loans;

  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-n">${pending.length}</div><div class="stat-l">대기 중</div></div>
      <div class="stat-card"><div class="stat-n">${active.length}</div><div class="stat-l">진행 중</div></div>
      <div class="stat-card"><div class="stat-n" style="color:${overdue.length?'var(--danger)':'var(--success)'}">${overdue.length}</div><div class="stat-l">연체</div></div>
    </div>
    ${active.length ? `<div class="balance-card">
      <div class="bal-label">총 대출 잔액 (이자 포함)</div>
      <div class="bal-num" id="debt-num">${fmt(totalDebt)}<span class="bal-unit">P</span></div>
      <div class="bal-icon">₩</div>
    </div>` : ''}
    ${overdue.length ? `<div class="al al-d"><span class="al-icon">🚨</span><div>연체 ${overdue.length}건 — 즉시 조치 필요</div></div>` : ''}
    <div class="tabs">
      ${[['pending','대기 중'],['active','진행 중'],['all','전체']].map(([t,l]) =>
        `<button class="tab ${_tab===t?'on':''}" onclick="setTab('${t}')">${l}${t==='pending'&&pending.length?` (${pending.length})`:''}</button>`
      ).join('')}
    </div>
    ${tabLoans.length
      ? tabLoans.map(l => loanItem(l, true)).join('')
      : `<div class="card"><div class="empty"><div class="empty-ic">✅</div>해당 대출이 없습니다</div></div>`}`;
}

function setTab(t) { _tab = t; renderMain(); }

/* LOAN ITEM */
function loanItem(loan, isAdmin) {
  const total = calcLocal(loan);
  const int = total - loan.amount;
  const isOv = loan.status === 'active' && Date.now() > loan.dueDate;
  const dLeft = getDaysLeft(loan);
  const startTs = loan.activatedAt || loan.requestedAt;
  const progPct = loan.status === 'active'
    ? Math.min(100, Math.max(0, (Date.now()-startTs)/(loan.dueDate-startTs)*100)) : 0;

  let actions = '';
  if (isAdmin) {
    if (loan.status === 'pending') actions = `
      <button class="btn btn-ok btn-xs" onclick="doApprove('${loan.id}')">✓ 승인</button>
      <button class="btn btn-danger btn-xs" onclick="doReject('${loan.id}')">✗ 거절</button>`;
    else if (loan.status === 'active') actions = `
      <button class="btn btn-warn btn-xs" onclick="doRepay('${loan.id}')">💰 상환 처리</button>
      <button class="btn btn-danger btn-xs" onclick="doDefault('${loan.id}')">전액 몰수</button>`;
  }

  return `<div class="li" id="li-${loan.id}">
    <div class="li-hd" onclick="toggleLi('${loan.id}')">
      <div>
        <div class="li-name">${loan.borrowerName}</div>
        <div class="li-sid">학번 ${loan.borrowerStudentId} · #${loan.id}</div>
      </div>
      <div>
        <div class="li-amt" id="ha-${loan.id}">${fmt(total)}P</div>
        ${int>0?`<div class="li-int">이자 <span id="int-${loan.id}">${fmt(int)}P</span></div>`:''}
      </div>
    </div>
    <div class="li-bd" id="bd-${loan.id}">
      <div class="meta">
        <div><div class="ml">신청일</div><div class="mv">${fmtDate(loan.requestedAt)}</div></div>
        <div><div class="ml">상환일</div><div class="mv ${isOv?'text-d':''}">${fmtDate(loan.dueDate)}</div></div>
        <div><div class="ml">원금</div><div class="mv">${fmt(loan.amount)}P</div></div>
        <div><div class="ml">상태</div><div class="mv">
          <span class="bdg ${statusBadge(loan.status, loan.dueDate)}">${statusText(loan.status, loan.dueDate)}</span>
          ${dLeft?`<span style="font-size:11px;color:var(--muted);margin-left:4px">${dLeft}</span>`:''}
        </div></div>
        ${loan.status==='active'?`
          <div><div class="ml">현재 이자</div><div class="mv text-w" id="int-${loan.id}s">${fmt(int)}P</div></div>
          <div><div class="ml">현재 상환액</div><div class="mv" style="font-weight:700" id="tot-${loan.id}">${fmt(total)}P</div></div>
        `:''}
        ${(loan.status==='repaid'||loan.status==='defaulted')&&loan.paidAmount?`
          <div><div class="ml">실제 상환액</div><div class="mv text-s">${fmt(loan.paidAmount)}P</div></div>
          <div><div class="ml">상환일시</div><div class="mv">${fmtDate(loan.paidAt)}</div></div>
        `:''}
      </div>
      ${loan.status==='active'?`
        <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">상환 기간 진행</div>
        <div class="prog"><div class="prog-fill ${isOv?'d':progPct>80?'w':''}" style="width:${progPct}%"></div></div></div>
      `:''}
      ${actions?`<div class="acts">${actions}</div>`:''}
    </div>
  </div>`;
}

function toggleLi(id) { document.getElementById('bd-'+id)?.classList.toggle('open'); }

/* ADMIN ACTIONS */
async function doApprove(id) {
  const loan = _loans.find(l => l.id === id);
  const total = calcLocal(loan);
  const res = await modal('대출 승인',
    `<b>${loan.borrowerName}</b> (학번 ${loan.borrowerStudentId})에게 <b>${fmt(loan.amount)}P</b>를 전송합니다.<br><br>
     ksain.kr에서 직접 포인트를 전송한 뒤 "전송 완료"를 클릭하세요.`,
    [
      { label: 'ksain.kr 열기 →', href: 'https://ksain.kr/point/transfer', cls: 'btn-primary' },
      { label: '전송 완료', value: 'ok', cls: 'btn-ok' },
      { label: '취소', value: null, cls: 'btn-out' },
    ]);
  if (res !== 'ok') return;
  try {
    await api('PATCH', '/api/loans/'+id, { action: 'approve' });
    toast('승인 완료!', 'ok');
    await loadLoans(); renderMain();
  } catch(e) { toast(e.message, 'err'); }
}

async function doReject(id) {
  const loan = _loans.find(l => l.id === id);
  const res = await modal('대출 거절',
    `${loan.borrowerName}님의 ${fmt(loan.amount)}P 신청을 거절하시겠습니까?`,
    [{ label: '거절', value:'ok', cls:'btn-danger' }, { label:'취소', value:null, cls:'btn-out' }]);
  if (res !== 'ok') return;
  try {
    await api('PATCH', '/api/loans/'+id, { action: 'reject' });
    toast('거절되었습니다.');
    await loadLoans(); renderMain();
  } catch(e) { toast(e.message, 'err'); }
}

async function doRepay(id) {
  const loan = _loans.find(l => l.id === id);
  const total = calcLocal(loan);
  const int = total - loan.amount;
  const res = await modal('상환 처리',
    `<b>${loan.borrowerName}</b>님으로부터 <b>${fmt(total)}P</b>를 받습니다.<br><br>
     <div style="background:var(--primary-soft);border-radius:8px;padding:12px;font-size:13px">
       원금: <b>${fmt(loan.amount)}P</b> + 이자: <b style="color:var(--warn)">${fmt(int)}P</b> = <b>${fmt(total)}P</b>
     </div>`,
    [{ label:'상환 완료', value:'ok', cls:'btn-ok' }, { label:'취소', value:null, cls:'btn-out' }]);
  if (res !== 'ok') return;
  try {
    await api('PATCH', '/api/loans/'+id, { action: 'repay', paidAmount: total });
    toast('상환 완료!', 'ok');
    await loadLoans(); renderMain();
  } catch(e) { toast(e.message, 'err'); }
}

async function doDefault(id) {
  const loan = _loans.find(l => l.id === id);
  const res = await modal('전액 몰수',
    `<b>${loan.borrowerName}</b>님의 모든 포인트를 가져갑니다.<br><br>
     ksain.kr에서 해당 사용자의 모든 포인트를 전송받은 후 클릭하세요.`,
    [
      { label: 'ksain.kr 열기 →', href: 'https://ksain.kr/point/transfer', cls: 'btn-primary' },
      { label: '몰수 완료', value:'ok', cls:'btn-danger' },
      { label: '취소', value:null, cls:'btn-out' }
    ]);
  if (res !== 'ok') return;
  try {
    await api('PATCH', '/api/loans/'+id, { action: 'default' });
    toast('몰수 처리 완료.');
    await loadLoans(); renderMain();
  } catch(e) { toast(e.message, 'err'); }
}

/* LOAD LOANS */
async function loadLoans() {
  const data = await api('GET', '/api/loans');
  _loans = data.loans || [];
}

/* INIT */
(async () => {
  try {
    const data = await api('GET', '/api/me');
    _user = data.user;
    if (_user) await loadLoans();
  } catch {}
  render();
})();
</script>
</body>
</html>
